# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Per-package log levels
org.slf4j.simpleLogger.log.com.layrly=INFO
org.slf4j.simpleLogger.log.com.layrly.ai=DEBUG
org.slf4j.simpleLogger.log.software.amazon.awssdk=WARN

# Log format — Lambda already adds timestamp, so keep it minimal
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true

# Output to stderr so CloudWatch captures it under the Lambda log stream
org.slf4j.simpleLogger.logFile=System.err

# Include log level in output
org.slf4j.simpleLogger.levelInBrackets=true
